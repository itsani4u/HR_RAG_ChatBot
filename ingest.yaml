# Cloud Run service definition for the INGEST API.
# Deployed and invoked SEPARATELY from the chatbot UI (see app.yaml).
# POST /ingest rebuilds the FAISS index from the PDFs baked into this image
# and publishes it to GCS, where the chatbot service picks it up.
#
# Deploy with:
#   gcloud run services replace ingest.yaml --region=YOUR_REGION --project=YOUR_PROJECT
#
# Trigger it (kept private — not --allow-unauthenticated — so a random caller
# can't rebuild your knowledge base):
#   TOKEN=$(gcloud auth print-identity-token)
#   INGEST_URL=$(gcloud run services describe hr-rag-ingest --region=YOUR_REGION --format='value(status.url)')
#   curl -X POST -H "Authorization: Bearer $TOKEN" "$INGEST_URL/ingest"
#
# Before deploying:
#   1. Build & push this image from Dockerfile.ingest (see readme.md), replace `image:` below.
#   2. Create the GCS bucket and grant this service's runtime service account write access:
#        gsutil mb -l us-central1 gs://YOUR_BUCKET
#        gcloud projects add-iam-policy-binding YOUR_PROJECT_ID \
#          --member="serviceAccount:YOUR_PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#          --role="roles/storage.objectAdmin"
#   3. Create the Gemini key secret (shared with the chatbot service):
#        gcloud secrets create google-api-key --data-file=<(echo -n "YOUR_KEY")
#        gcloud secrets add-iam-policy-binding google-api-key \
#          --member="serviceAccount:YOUR_PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#          --role="roles/secretmanager.secretAccessor"
#   4. Grant yourself (or a Cloud Scheduler service account) invoker access:
#        gcloud run services add-iam-policy-binding hr-rag-ingest \
#          --region=YOUR_REGION --member="user:you@example.com" --role="roles/run.invoker"

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hr-rag-ingest
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 900
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/hr-rag-chatbot/hr-rag-ingest:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: EMBEDDING_MODEL
              value: "models/gemini-embedding-001"
            - name: GCS_BUCKET
              value: "YOUR_BUCKET"
            - name: GCS_INDEX_PREFIX
              value: "hr_faiss_index"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
  traffic:
    - percent: 100
      latestRevision: true
