# Cloud Run service definition for the CHATBOT UI.
# The ingest API is a separate service — see ingest.yaml.
#
# Deploy with:
#   gcloud run services replace app.yaml --region=YOUR_REGION --project=YOUR_PROJECT
#
# Before deploying:
#   1. Build & push this image from Dockerfile (see readme.md), replace `image:` below.
#   2. Create the GCS bucket the ingest service publishes to, and grant this
#      service's runtime service account read access:
#        gsutil mb -l us-central1 gs://YOUR_BUCKET
#        gcloud projects add-iam-policy-binding YOUR_PROJECT_ID \
#          --member="serviceAccount:YOUR_PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#          --role="roles/storage.objectViewer"
#   3. Create the Gemini key secret (same one the ingest service uses is fine):
#        gcloud secrets create google-api-key --data-file=<(echo -n "YOUR_KEY")
#        gcloud secrets add-iam-policy-binding google-api-key \
#          --member="serviceAccount:YOUR_PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#          --role="roles/secretmanager.secretAccessor"
#   4. Run the ingest service's /ingest endpoint at least once BEFORE the
#      chatbot's first request, so there is an index in the bucket to load.
#   5. Allow public access if desired:
#        gcloud run services add-iam-policy-binding hr-rag-chatbot \
#          --region=YOUR_REGION --member="allUsers" --role="roles/run.invoker"

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hr-rag-chatbot
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/hr-rag-chatbot/hr-rag-chatbot:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MODEL
              value: "gemini-2.5-flash"
            - name: EMBEDDING_MODEL
              value: "models/gemini-embedding-001"
            - name: GCS_BUCKET
              value: "YOUR_BUCKET"
            - name: GCS_INDEX_PREFIX
              value: "hr_faiss_index"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
  traffic:
    - percent: 100
      latestRevision: true
