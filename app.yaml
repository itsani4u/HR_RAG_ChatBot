# Cloud Run service definition.
# Deploy with:
#   gcloud run services replace app.yaml --region=YOUR_REGION --project=YOUR_PROJECT
#
# Before deploying:
#   1. Build & push the image (see readme.md), then replace the `image:` value below.
#   2. Create a secret for the Gemini key:
#        gcloud secrets create google-api-key --data-file=<(echo -n "YOUR_KEY")
#      and grant the Cloud Run service account access:
#        gcloud secrets add-iam-policy-binding google-api-key \
#          --member="serviceAccount:YOUR_PROJECT_NUMBER-compute@developer.gserviceaccount.com" \
#          --role="roles/secretmanager.secretAccessor"
#   3. After the first deploy, allow public access if desired:
#        gcloud run services add-iam-policy-binding hr-rag-chatbot \
#          --region=YOUR_REGION --member="allUsers" --role="roles/run.invoker"

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hr-rag-chatbot
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/hr-rag-chatbot/hr-rag-chatbot:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: MODEL
              value: "gemini-2.5-flash"
            - name: EMBEDDING_MODEL
              value: "models/gemini-embedding-001"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
  traffic:
    - percent: 100
      latestRevision: true
